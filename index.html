<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dante Fuego</title>
  <meta name="description" content="Inferno Collection — wearable verse for those who have walked through the fire.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/BertholdFraktur.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('fonts-pending');</script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <a href="/" class="site-header-logo" aria-label="Dante Fuego home">
    <span class="logo-dante">Dante Fu</span><span class="logo-fuego">ego</span>
  </a>
  <nav class="site-header-nav" aria-label="Primary">
    <a href="#products">Collection</a>
    <a href="/cart.html" class="site-header-cart">Cart <span id="cartCount" class="cart-count" hidden>0</span></a>
  </nav>
</header>

<section id="hero">
  <div class="hero-bg"></div>
  <div class="hero-embers" id="embers"></div>
</section>
<div class="hero-logo-pin" id="heroLogoPin">
  <div class="hero-logo-stack">
    <h1 class="hero-logo" id="heroLogo">
      <span class="logo-dante">Dante Fu</span><span class="logo-fuego">ego</span>
    </h1>
    <p class="hero-subtitle">Los Angeles Est. 2020</p>
  </div>
</div>

<div class="divider"></div>

<section id="products">
  <div class="products-grid" id="productsGrid">
    <div class="loading">Loading Collection...</div>
  </div>
</section>

<footer>
  <p class="footer-logo-text">
    <span class="logo-dante">Dante Fu</span><span class="logo-fuego">ego</span>
  </p>
  <nav class="footer-links" aria-label="Footer">
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
