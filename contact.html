<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Dante Fuego</title>
  <meta name="description" content="Get in touch with Dante Fuego for orders, sizing, and general questions.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="128x128">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/BertholdFraktur.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('fonts-pending');</script>
</head>
<body>

<header class="site-header site-header-visible">
  <a href="/" class="site-header-logo" aria-label="Dante Fuego home">
    <span class="logo-dante">Dante Fu</span><span class="logo-fuego">ego</span>
  </a>
  <nav class="site-header-nav" aria-label="Primary">
    <a href="/#products">Collection</a>
    <a href="/cart.html" class="site-header-cart">Cart <span id="cartCount" class="cart-count" hidden>0</span></a>
  </nav>
</header>

<main class="contact-page" id="contactPage">
  <div class="contact-page-inner">
    <a class="product-back" href="/">Back to home</a>

    <div id="contactStatus" class="contact-status" role="status" aria-live="polite" hidden></div>

    <p class="contact-intro">Send a message and we will get back to you.</p>

    <div class="contact-panel">
      <form id="contactForm" class="contact-form" aria-label="Contact form" novalidate>
        <input
          type="checkbox"
          name="botcheck"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
          class="contact-honeypot"
        >

        <div class="contact-form-row">
          <div class="contact-field">
            <label for="contact-first-name" class="sr-only">First name (required)</label>
            <input
              id="contact-first-name"
              name="firstName"
              type="text"
              autocomplete="given-name"
              required
              placeholder="First name *"
              class="contact-input"
            >
          </div>
          <div class="contact-field">
            <label for="contact-last-name" class="sr-only">Last name (required)</label>
            <input
              id="contact-last-name"
              name="lastName"
              type="text"
              autocomplete="family-name"
              required
              placeholder="Last name *"
              class="contact-input"
            >
          </div>
        </div>

        <div class="contact-field">
          <label for="contact-email" class="sr-only">Email (required)</label>
          <input
            id="contact-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="Email *"
            class="contact-input"
            aria-describedby="contact-email-error"
          >
          <p id="contact-email-error" class="contact-field-error" role="alert" hidden></p>
        </div>

        <div class="contact-field">
          <label for="contact-order" class="sr-only">Order number (optional)</label>
          <input
            id="contact-order"
            name="orderNumber"
            type="text"
            autocomplete="off"
            placeholder="Order number (optional)"
            class="contact-input"
          >
        </div>

        <div class="contact-field">
          <label for="contact-message" class="sr-only">Message (optional)</label>
          <textarea
            id="contact-message"
            name="message"
            rows="4"
            placeholder="How can we help? (optional)"
            class="contact-input contact-textarea"
          ></textarea>
        </div>

        <div class="contact-form-footer">
          <button type="submit" class="pay-btn pay-stripe contact-submit" id="contactSubmit">
            Submit
          </button>
          <p class="contact-mailto">
            Prefer to write freehand?
            <a id="contactMailto" href="mailto:hello@dantefuego.com">hello@dantefuego.com</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</main>

<footer>
  <p class="footer-logo-text">
    <span class="logo-dante">Dante Fu</span><span class="logo-fuego">ego</span>
  </p>
  <nav class="footer-links" aria-label="Footer">
    <a href="#">About</a>
    <a href="/contact.html" aria-current="page">Contact</a>
  </nav>
</footer>

<script type="module" src="contact.js"></script>
</body>
</html>
